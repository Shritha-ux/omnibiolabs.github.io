<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniBio Labs | Democratizing Hands-On K-8 Life Sciences</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #fcfcfd;
            color: #1e293b;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px;
            text-align: center;
        }
        .card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            padding: 48px 32px;
            max-width: 640px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }
        .logo-title {
            font-size: 3rem;
            font-weight: 800;
            color: #1e1b4b;
            letter-spacing: -1px;
            margin-bottom: 4px;
        }
        .logo-sub {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 5px;
            color: #6366f1;
            margin-bottom: 28px;
        }
        .tagline {
            font-size: 1.4rem;
            font-weight: 600;
            color: #312e81;
            margin-bottom: 16px;
        }
        .description {
            font-size: 1.05rem;
            line-height: 1.6;
            color: #475569;
            margin-bottom: 32px;
        }
        .badge {
            display: inline-block;
            background-color: #e0e7ff;
            color: #3730a3;
            padding: 8px 18px;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1 class="logo-title">OmniBio</h1>
        <div class="logo-sub">LABS</div>
        <p class="tagline">Big discoveries start with young minds.</p>
        <p class="description">
            Deploying collegiate-tier, hands-on BSL-1 life sciences and micro-analytics laboratory suites to K-8 students.
        </p>
        <div class="badge">Official Website & Application Portal Launching Soon</div>
    </div>
</body>
</html>
